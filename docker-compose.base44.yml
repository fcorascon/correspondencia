services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: correspondencia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:22-alpine
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - uploads:/uploads
    command: sh -c "npm install --silent && node server.js"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/correspondencia
      PORT: "3001"
      UPLOAD_DIR: /uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
  api_node_modules:
  uploads:
